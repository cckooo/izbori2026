# Objavljuje izbori2026.html na GitHub Pages bez menjanja repozitorijuma (posle izmena koda ili naselja).
# Pokreće se sam pri svakom push-u na main koji menja sajt, ili ručno.
name: Objavi sajt

on:
  push:
    branches: [main]
    paths: ["izbori2026.html", "og.png", "ikona.png", "podeli_sajt.py", "prerender.py", "stranice_opstina.py", "mapa_naselja.json", "mapa_inostranstvo.json", "goatcounter.js", "google*.html", "llms.txt"]
  workflow_dispatch: {}

permissions:
  pages: write
  id-token: write

concurrency:
  group: osvezi
  cancel-in-progress: false

jobs:
  objavi:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0       # istorija za vreme poslednje izmene sajta (podeli_sajt.py)
          filter: blob:none
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Pripremi sajt
        run: python3 podeli_sajt.py _site && cp og.png ikona.png _site/
      - name: Gotov Pregled u stranici (brže otvaranje; ako ne uspe, objava ide dalje)
        run: (python3 -m pip install -q playwright==1.64.1 && python3 prerender.py _site) || echo "Bez gotovog Pregleda"
      - name: Stranice opština, sitemap (ako ne uspe, objava ide dalje)
        run: python3 stranice_opstina.py _site || echo "Bez stranica opština"
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
