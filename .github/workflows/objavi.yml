# Objavljuje izbori2026.html na GitHub Pages bez menjanja repozitorijuma (posle izmena koda ili naselja).
# Pokreće se sam pri svakom push-u na main koji menja sajt, ili ručno.
name: Objavi sajt

on:
  push:
    branches: [main]
    paths: ["izbori2026.html", "og.png", "ikona.png", "podeli_sajt.py", "prerender.py", "mapa_naselja.json"]
  workflow_dispatch: {}

permissions:
  pages: write
  id-token: write

concurrency:
  group: osvezi
  cancel-in-progress: false

jobs:
  objavi:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0       # istorija za vreme poslednje izmene sajta (podeli_sajt.py)
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pripremi sajt
        run: python3 podeli_sajt.py _site && cp og.png ikona.png _site/
      - name: Gotov Pregled u stranici (brže otvaranje; ako ne uspe, objava ide dalje)
        run: (python3 -m pip install -q playwright==1.64.1 && python3 prerender.py _site) || echo "Bez gotovog Pregleda"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
