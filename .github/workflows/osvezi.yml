# Osvežava izbori2026.html iz CSV-a RIK-a i objavljuje sajt na GitHub Pages.
# Zakazano na svakih 15 minuta (GitHub ne garantuje tačno vreme; kašnjenje od par minuta je uobičajeno).
# Za objavu izmena koda/naselja bez povlačenja rezultata koristi objavi.yml.
name: Osveži rezultate

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: osvezi
  cancel-in-progress: false

jobs:
  osvezi:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0       # istorija za vreme poslednje izmene sajta (podeli_sajt.py)
          filter: blob:none
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Skini CSV i ažuriraj HTML
        run: python update.py
      - name: Sačuvaj promenu u repozitorijumu
        run: |
          if git diff --quiet izbori2026.html; then echo "Nema promena"; exit 0; fi
          git config user.name "izbori-bot"
          git config user.email "izbori-bot@users.noreply.github.com"
          git add izbori2026.html zapisnici_putanje.json
          git commit -m "Rezultati: $(grep -o '"snapshot":"[^"]*"' izbori2026.html | cut -d'"' -f4)"
          git push
      - name: Pripremi sajt
        run: python3 podeli_sajt.py _site --podaci && cp og.png ikona.png _site/
      - name: Gotov Pregled u stranici (brže otvaranje; ako ne uspe, objava ide dalje)
        run: (python3 -m pip install -q playwright==1.64.1 && python3 prerender.py _site) || echo "Bez gotovog Pregleda"
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
