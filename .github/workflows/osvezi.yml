# Osvežava izbori2026.html iz CSV-a RIK-a i objavljuje sajt na GitHub Pages.
# Zakazano pokretanje GitHub u praksi pokreće na 45–60 minuta, pa se osvežavanje samo ponovo pokreće (posao „lanac“):
# posle objave sačeka ~8 minuta i pokrene sledeće, dok RIK ne unese sva biračka mesta. Zakazano pokretanje ostaje
# kao rezerva ako se lanac prekine. Za objavu izmena koda/naselja koristi objavi.yml.
name: Osveži rezultate

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  osvezi:
    runs-on: ubuntu-latest
    # ista grupa kao objavi.yml: objave idu jedna za drugom; čekanje u lancu nije u grupi, pa ne blokira objave
    concurrency:
      group: osvezi
      cancel-in-progress: false
    environment:
      name: github-pages
    outputs:
      nastavi: ${{ steps.stanje.outputs.nastavi }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0       # istorija za vreme poslednje izmene sajta (podeli_sajt.py)
          filter: blob:none
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Skini CSV i ažuriraj HTML
        run: python update.py
      - name: Da li ima još neobrađenih mesta (lanac staje kad su sva uneta)
        id: stanje
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'EOF'
          import json, re
          rows = json.loads(re.search(r"^const DATA=(.*);\r?$", open("izbori2026.html", encoding="utf-8").read(), re.M).group(1))["rows"]
          print("nastavi=" + ("da" if sum(r[8] for r in rows) < len(rows) else "ne"))
          EOF
      - name: Sačuvaj promenu u repozitorijumu
        run: |
          if git diff --quiet izbori2026.html; then echo "Nema promena"; exit 0; fi
          git config user.name "izbori-bot"
          git config user.email "izbori-bot@users.noreply.github.com"
          git add izbori2026.html zapisnici_putanje.json
          git commit -m "Rezultati: $(grep -o '"snapshot":"[^"]*"' izbori2026.html | cut -d'"' -f4)"
          git pull --rebase -q && git push
      - name: Pripremi sajt
        run: python3 podeli_sajt.py _site --podaci && cp og.png ikona.png _site/
      - name: Gotov Pregled u stranici (brže otvaranje; ako ne uspe, objava ide dalje)
        run: (python3 -m pip install -q playwright==1.64.1 && python3 prerender.py _site) || echo "Bez gotovog Pregleda"
      - name: Stranice opština, sitemap (ako ne uspe, objava ide dalje)
        run: python3 stranice_opstina.py _site || echo "Bez stranica opština"
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  lanac:
    needs: osvezi
    # i kad osvežavanje ne uspe (npr. RIK nedostupan), lanac ide dalje; staje tek kad su sva mesta uneta
    if: ${{ !cancelled() && needs.osvezi.outputs.nastavi != 'ne' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Sačekaj i pokreni sledeće osvežavanje (ako već ne čeka neko drugo)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sleep 480
          drugi=$(gh run list --workflow osvezi.yml --limit 20 --json databaseId,status \
            -q '[.[] | select(.databaseId != ${{ github.run_id }} and (.status=="queued" or .status=="in_progress" or .status=="waiting" or .status=="pending" or .status=="requested"))] | length')
          if [ "$drugi" -gt 0 ]; then echo "Drugo osvežavanje već čeka ili radi ($drugi), lanac nastavlja ono"; exit 0; fi
          gh workflow run osvezi.yml --ref main
